# Copy to application-local.properties (gitignored) or export these as environment variables.
# Never commit real credentials to version control.

# Example environment variables:
# DB_URL=jdbc:mysql://localhost:3306/hotel_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# DB_USERNAME=your_mysql_username
# DB_PASSWORD=your_mysql_password
# CORS_ALLOWED_ORIGINS=http://localhost:4200
# SERVER_PORT=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
server.port=${SERVER_PORT:8080}

